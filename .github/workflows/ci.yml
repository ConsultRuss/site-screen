name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests + mini-eval
        run: pytest -q

  worker-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Offline replay only: the rule parser over the labelled cases, plus any
      # recorded model responses. No API key, no spend, deterministic. The live
      # model run (`--live`) is manual. Fails if accuracy drops below the floors
      # in worker/evals/thresholds.json, or if the browser's copy of the parser
      # has drifted from the Worker's.
      - name: Ask-the-map eval (offline)
        run: node worker/evals/run.mjs --ci

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned binary + full-history scan. The gitleaks-action errors on a repo's
      # first push (root commit has no parent for its range scan), so we run the
      # binary directly.
      - name: gitleaks (full history)
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact -v
